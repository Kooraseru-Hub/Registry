name: Read-only DevForum release draft smoke
on:
  push:
    branches: [feat/devforum-drafts]
    paths: ['.github/workflows/forum-draft-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: Kooraseru-Hub/CI-Packages/packages/devforum/announcement@00e16b1187b849ec91a124d2f2bc586d287da367
        with:
          repository: ${{ github.repository }}
          tag: '2.0.0'
          config: content/readme/devforum.json
          output: build/forum-release-smoke
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: devforum-release-smoke-draft
          path: build/forum-release-smoke
          if-no-files-found: error
