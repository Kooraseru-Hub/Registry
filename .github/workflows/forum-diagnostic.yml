name: DevForum diagnostic
on:
  push:
    branches: [fix/devforum-publication]
    paths: ['.github/workflows/forum-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Kooraseru-Hub/CI-Packages
          ref: 1339cccda7451615ea5309a55995611068b9364f
          path: build/ci-packages
          persist-credentials: false
      - name: Inspect existing public post without credentials
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const {cookedImages, publicImageURL} = require('./build/ci-packages/packages/devforum/post.cjs');
          const {destination} = JSON.parse(fs.readFileSync('content/readme/devforum.json'));
          (async () => {
            const response = await fetch('https://devforum.roblox.com/posts/' + destination.postId + '.json', {headers:{Accept:'application/json'},redirect:'error'});
            if(!response.ok) throw Error('Public post HTTP ' + response.status);
            const post = await response.json();
            console.log(JSON.stringify({id:post.id,updated_at:post.updated_at,version:post.version}));
            const images = cookedImages(post.raw,post.cooked);
            for (const [ref,urls] of images) {
              for (const value of urls) {
                const u = new URL(value,'https://devforum.roblox.com');
                const kind = u.pathname.split('/').slice(0,3).join('/');
                let accepted = true;
                try { publicImageURL(value); } catch { accepted = false; }
                let status, png;
                if (u.protocol === 'https:' && !u.username && !u.password && !u.port && !u.search && !u.hash &&
                    ['devforum.roblox.com','devforum-uploads.s3.dualstack.us-east-2.amazonaws.com'].includes(u.hostname)) {
                  try {
                    const r = await fetch(u,{headers:{Range:'bytes=0-7'},redirect:'manual',credentials:'omit',signal:AbortSignal.timeout(15000)});
                    status = r.status;
                    if (status === 200 || status === 206) png=Buffer.from(await r.arrayBuffer()).subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10]));
                    else await r.body?.cancel();
                  } catch { status='transport failure'; }
                }
                console.log(JSON.stringify({ref,host:u.hostname,kind,query:!!u.search,fragment:!!u.hash,accepted,status,png}));
              }
            }
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          JS
