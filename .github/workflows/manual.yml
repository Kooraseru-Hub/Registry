name: CI Request

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select an available CI operation
        type: choice
        required: true
        default: validation
        options:
          - build
          - publish
          - publish-check
          - readiness
          - rules-audit
          - validation
      publish:
        description: Confirm publication for publish
        type: boolean
        required: false
        default: false

      expected_sha:
        description: Expected source revision for automated publication
        type: string
        required: false

permissions: {}
jobs:
  benchmark:
    name: Measure Registry
    if: inputs.operation == 'publish' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.expected_sha == '' || inputs.expected_sha == github.sha)
    runs-on: windows-latest
    timeout-minutes: 45
    environment: roblox-test
    concurrency:
      group: registry-cloud-benchmark
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Run the declared benchmark
        env:
          ROBLOX_TEST_API_KEY: ${{ secrets.ROBLOX_TEST_API_KEY }}
          ROBLOX_TEST_UNIVERSE_ID: ${{ vars.ROBLOX_TEST_UNIVERSE_ID }}
          ROBLOX_TEST_PLACE_ID: ${{ vars.ROBLOX_TEST_PLACE_ID }}
        run: node dependencies/packages/checks/testSuites/run.cjs registry cloud --benchmark
      - uses: actions/upload-artifact@v7
        with:
          name: registry-benchmark-${{ github.sha }}-${{ github.run_attempt }}
          path: build/artifacts/benchmarks/cloud/registry
          if-no-files-found: error
          retention-days: 14

  dispatch:
    needs: benchmark
    if: always() && (needs.benchmark.result == 'success' || needs.benchmark.result == 'skipped')
    name: Request CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Submit immutable request
        env:
          GH_TOKEN: ${{ github.token }}
          CI_OPERATION: ${{ inputs.operation }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_PUBLISH: ${{ inputs.publish }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          REQUEST_INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          if [[ -n "$EXPECTED_SHA" && "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "A newer revision owns source"
            exit 0
          fi
          REQUEST_REF="$GITHUB_REF"
          REQUEST_SHA="$GITHUB_SHA"
          if [[ -z "${REQUEST_INPUTS:-}" ]]; then REQUEST_INPUTS='{}'; fi
          if [[ "$BENCHMARK_RESULT" == success ]]; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)
            if [[ "$current" != "$GITHUB_SHA" ]]; then exit 0; fi
            REQUEST_INPUTS=$(jq --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '. + {benchmark_run:$run,benchmark_attempt:$attempt}' <<< "$REQUEST_INPUTS")
          fi
          jq -n --arg event 'workflow_dispatch' --arg operation "$CI_OPERATION" --arg ref "$REQUEST_REF" --arg sha "$REQUEST_SHA" --argjson publish "${REQUEST_PUBLISH:-false}" --argjson pr "${PR_NUMBER:-0}" --argjson inputs "$REQUEST_INPUTS" '{event_type:"ci-request",client_payload:{event:$event,operation:$operation,ref:$ref,sha:$sha,publish:$publish,pr:$pr,inputs:$inputs}}' | gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -
