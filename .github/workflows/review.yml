name: PR Results
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions: {}
jobs:
  resolve:
    if: github.event.workflow_run.event == 'pull_request' && contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/components/quality/code-review/resolve.cjs open
  review:
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: review-pr-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          REQUEST_SHA: ${{ needs.resolve.outputs.sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node .github/components/quality/code-review/publish.cjs
