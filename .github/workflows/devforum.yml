name: DevForum release
on:
  pull_request:
    paths: ['.github/workflows/devforum.yml', 'releases/2.0.0/devforum.md', 'content/readme/devforum.json']
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      mode:
        description: Draft is read-only; post requires an approved draft digest
        type: choice
        options: [draft, post, disabled]
        default: draft
      approved_draft:
        description: Exact SHA-256 from a reviewed release draft
        type: string
        default: ''
      tag:
        description: Exact already-published release tag
        type: string
        required: true
        default: '2.0.0'
permissions:
  contents: read
jobs:
  draft:
    if: github.event_name == 'pull_request' || github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease || github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && inputs.mode == 'draft'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: Kooraseru-Hub/CI-Packages/packages/devforum/announcement@41ff5a092a080c3121fe6f6e66ea529534963544
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.event.release.tag_name || inputs.tag || '2.0.0' }}
          config: content/readme/devforum.json
          output: build/devforum-release
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: devforum-release-draft
          path: build/devforum-release
          if-no-files-found: error
  deliver:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && inputs.mode == 'post'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ci-devforum
    concurrency:
      group: devforum-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: Kooraseru-Hub/CI-Packages/packages/devforum/deliver@41ff5a092a080c3121fe6f6e66ea529534963544
        with:
          repository: ${{ github.repository }}
          tag: ${{ inputs.tag }}
          config: content/readme/devforum.json
          approval: ${{ inputs.approved_draft }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEVFORUM_UPLOAD_KEY: ${{ secrets.DEVFORUM_USER_API_KEY }}
          DEVFORUM_UPLOAD_CLIENT: ${{ vars.DEVFORUM_USER_API_CLIENT_ID || 'discourse-mcp' }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
