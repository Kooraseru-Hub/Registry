name: DevForum release draft
on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact already-published release tag
        type: string
        required: true
permissions:
  contents: read
jobs:
  draft:
    if: github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease || github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: Kooraseru-Hub/CI-Packages/packages/devforum/announcement@c361be8a3a1a345d69a0da53ca2585ef9d130502
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.event.release.tag_name || inputs.tag }}
          config: content/readme/devforum.json
          output: build/devforum-release
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: devforum-release-draft
          path: build/devforum-release
          if-no-files-found: error
