name: Benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    timeout-minutes: 45
    environment: roblox-test
    concurrency:
      group: registry-cloud-benchmark
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Run Roblox Open Cloud benchmark
        env:
          ROBLOX_TEST_API_KEY: ${{ secrets.ROBLOX_TEST_API_KEY }}
          ROBLOX_TEST_UNIVERSE_ID: ${{ vars.ROBLOX_TEST_UNIVERSE_ID }}
          ROBLOX_TEST_PLACE_ID: ${{ vars.ROBLOX_TEST_PLACE_ID }}
        run: node dependencies/packages/checks/testSuites/run.cjs registry cloud --benchmark
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: registry-benchmark-${{ github.sha }}-${{ github.run_attempt }}
          path: build/artifacts/benchmarks/cloud/registry
          if-no-files-found: error
          retention-days: 14
