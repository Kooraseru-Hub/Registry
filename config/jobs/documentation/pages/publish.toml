# Native Pages adapter descriptor; the pinned engine owns the actual action versions.
[permissions]
contents = "read"
pages = "write"
id-token = "write"

[concurrency]
group = "pages-site-${{ github.repository }}"
cancel-in-progress = false

[environment]
name = "github-pages"
url = "${{ steps.deployment.outputs.page_url }}"

[[steps]]
name = "Resolve Pages deployment"
id = "pages"
run = "node dependencies/packages/core/dependencyLoader/index.ts --exec tools.ciEngine native --pages-options"
[steps.env]
GH_TOKEN = "${{ github.token }}"

[[steps]]
name = "Upload Pages artifact"
uses = "actions/upload-pages-artifact@v4"
if = "${{ steps.pages.outputs.enabled == 'true' }}"
[steps.with]
path = "build/artifacts/pages/production"

[[steps]]
name = "Deploy Pages"
id = "deployment"
uses = "actions/deploy-pages@v4"
if = "${{ steps.pages.outputs.enabled == 'true' }}"
